<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Drive">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Drive</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f7f7f8}
    *{box-sizing:border-box} body{margin:0} main{max-width:560px;margin:auto;padding:20px 16px 40px}
    h1,h2,p{margin:0}.date{color:#6b7280;font-size:14px;margin-top:4px}.money{font-variant-numeric:tabular-nums}
    header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
    .brand{font-size:25px;font-weight:750}.status{font-size:12px;color:#6b7280;margin-top:7px;text-align:right}
    .summary{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;margin-bottom:12px}
    .label{font-size:14px;color:#6b7280}.big{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin-top:4px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    button{font:inherit;cursor:pointer;border:0}.btn{min-height:56px;border-radius:17px;padding:13px 14px;text-align:left;font-weight:650;background:#fff;border:1px solid #e5e7eb}
    .primary{background:#111827;color:#fff;border-color:#111827}.btn .ico{font-size:21px;display:block;margin-bottom:4px}
    .cards{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:4px 16px;margin:12px 0}
    .row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.muted{color:#6b7280}
    .section{margin-top:22px}.section h2{font-size:16px;margin-bottom:10px}
    .activity{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
    .activity .row{padding:12px 16px;font-size:14px}
    .empty{padding:20px;color:#6b7280;text-align:center;font-size:14px}
    .sheet{display:none;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-top:12px}
    .sheet.show{display:block}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .close{background:none;color:#6b7280;padding:6px}.field{display:block;font-size:14px;font-weight:600;margin:12px 0}
    input,select{display:block;width:100%;margin-top:7px;border:1px solid #d1d5db;border-radius:13px;padding:14px;font-size:18px;background:#fff}
    .full{width:100%;text-align:center;margin-top:12px}.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    .type{min-height:48px;border-radius:13px;background:#fff;border:1px solid #e5e7eb}.type.selected{border-color:#111827;background:#f3f4f6}
    .result{border-radius:15px;padding:14px;margin-top:12px;background:#f3f4f6}.ok{background:#ecfdf5}.bad{background:#fef2f2}.warn{background:#fffbeb}
    .hidden{display:none!important}.danger{color:#b91c1c}.small{font-size:13px}
    @media(max-width:360px){.grid{grid-template-columns:1fr}.big{font-size:34px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="brand">Drive</div><div id="date" class="date"></div></div>
    <div id="dayStatus" class="status">EN CURSO</div>
  </header>

  <section class="summary">
    <div class="label">Efectivo registrado</div>
    <div id="cash" class="big money">$0.00</div>
  </section>

  <div class="grid">
    <button class="btn primary" id="cashBtn"><span class="ico">＋</span>Registrar efectivo</button>
    <button class="btn" id="cardBtn"><span class="ico">💳</span>Registrar tarjeta</button>
  </div>
  <div class="grid">
    <button class="btn" id="expenseBtn"><span class="ico">⛽</span>Registrar gasto</button>
    <button class="btn" id="closeBtn"><span class="ico">🔒</span>Cierre de día</button>
  </div>

  <section class="cards">
    <div class="row"><span class="muted">💳 Tarjeta Didi</span><strong id="card" class="money">$0.00</strong></div>
    <div class="row"><span class="muted">⛽ Gastos</span><strong id="expenses" class="money">$0.00</strong></div>
    <div class="row"><span>Total generado</span><strong id="total" class="money">$0.00</strong></div>
  </section>

  <section id="form" class="sheet">
    <div class="sheethead"><h2 id="formTitle">Registrar</h2><button class="close" id="cancel">Cancelar</button></div>
    <label class="field">Monto
      <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
    </label>
    <div id="expenseTypes" class="typegrid hidden">
      <button class="type" data-type="Gasolina">⛽ Gasolina</button>
      <button class="type" data-type="Comida">🍔 Comida</button>
      <button class="type" data-type="Estacionamiento">🅿️ Estacionamiento</button>
      <button class="type" data-type="Otro">＋ Otro</button>
    </div>
    <button class="btn primary full" id="save">Guardar</button>
    <p id="formMsg" class="small muted" style="margin-top:9px"></p>
  </section>

  <section id="closeForm" class="sheet">
    <div class="sheethead"><h2>Cierre de día</h2><button class="close" id="cancelClose">Cancelar</button></div>
    <div class="cards" style="margin:0">
      <div class="row"><span class="muted">Efectivo registrado</span><strong id="cCash">$0.00</strong></div>
      <div class="row"><span class="muted">Gastos en efectivo</span><strong id="cExp">$0.00</strong></div>
      <div class="row"><span>Efectivo esperado</span><strong id="expected">$0.00</strong></div>
    </div>
    <label class="field">Efectivo contado
      <input id="counted" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
    </label>
    <button class="btn primary full" id="check">Comprobar cierre</button>
    <div id="closeResult" class="result hidden"></div>
    <button class="btn full hidden" id="finishClose">Guardar cierre</button>
  </section>

  <section class="section">
    <h2>Movimientos de hoy</h2>
    <div id="activity" class="activity"><div class="empty">Aún no hay movimientos.</div></div>
  </section>
</main>

<script>
(() => {
  const KEY='drive-pwa-v1';
  const todayKey=()=>{const d=new Date();return d.toISOString().slice(0,10)};
  const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0);
  const dateFmt=()=>new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  const blank=()=>({date:todayKey(),cash:0,card:0,expenses:0,expenseItems:[],entries:[],closed:false,counted:null});
  let data=load();
  let mode=null, expenseType='';

  function load(){
    try{
      const all=JSON.parse(localStorage.getItem(KEY)||'{}');
      const k=todayKey();
      if(!all[k]){all[k]=blank();localStorage.setItem(KEY,JSON.stringify(all))}
      return all[k];
    }catch(e){return blank()}
  }
  function save(){const all=JSON.parse(localStorage.getItem(KEY)||'{}');all[todayKey()]=data;localStorage.setItem(KEY,JSON.stringify(all))}
  function el(id){return document.getElementById(id)}
  function render(){
    el('date').textContent=dateFmt();
    el('cash').textContent=fmt(data.cash);
    el('card').textContent=fmt(data.card);
    el('expenses').textContent=fmt(data.expenses);
    el('total').textContent=fmt(data.cash+data.card);
    el('dayStatus').textContent=data.closed?'DÍA CERRADO':'EN CURSO';
    el('dayStatus').style.color=data.closed?'#047857':'#6b7280';
    const a=el('activity');
    if(!data.entries.length){a.innerHTML='<div class="empty">Aún no hay movimientos.</div>';return}
    a.innerHTML=data.entries.slice().reverse().slice(0,12).map(x=>
      `<div class="row"><span>${esc(x.label)}<br><span class="small muted">${esc(x.time)}</span></span><strong class="money">${fmt(x.amount)}</strong></div>`
    ).join('');
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
  function openForm(m){
    if(data.closed){alert('Este día ya está cerrado.');return}
    mode=m;expenseType='';
    el('form').classList.add('show');el('closeForm').classList.remove('show');
    el('formTitle').textContent=m==='cash'?'Registrar efectivo':m==='card'?'Registrar tarjeta':'Registrar gasto';
    el('expenseTypes').classList.toggle('hidden',m!=='expense');el('amount').value='';el('formMsg').textContent='';
    document.querySelectorAll('.type').forEach(x=>x.classList.remove('selected'));
    setTimeout(()=>el('amount').focus(),50);
  }
  function hideForms(){el('form').classList.remove('show');el('closeForm').classList.remove('show')}
  function now(){return new Intl.DateTimeFormat('es-MX',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
  el('cashBtn').onclick=()=>openForm('cash');
  el('cardBtn').onclick=()=>openForm('card');
  el('expenseBtn').onclick=()=>openForm('expense');
  el('cancel').onclick=hideForms;
  document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{expenseType=b.dataset.type;document.querySelectorAll('.type').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
  el('save').onclick=()=>{
    const v=Number(el('amount').value);
    if(!Number.isFinite(v)||v<=0){el('formMsg').textContent='Introduce un monto válido.';return}
    if(mode==='cash'){data.cash+=v;data.entries.push({label:'Efectivo',amount:v,time:now()})}
    if(mode==='card'){data.card=v;data.entries.push({label:'Tarjeta Didi',amount:v,time:now()})}
    if(mode==='expense'){data.expenses+=v;data.expenseItems.push({type:expenseType||'Otro',amount:v});data.entries.push({label:'Gasto · '+(expenseType||'Otro'),amount:v,time:now()})}
    save();hideForms();render();
  };
  el('closeBtn').onclick=()=>{
    if(data.closed){alert('Este día ya está cerrado.');return}
    hideForms();el('closeForm').classList.add('show');
    el('cCash').textContent=fmt(data.cash);el('cExp').textContent=fmt(data.expenses);
    el('expected').textContent=fmt(Math.max(0,data.cash-data.expenses));
    el('counted').value='';el('closeResult').className='result hidden';el('finishClose').classList.add('hidden');
    setTimeout(()=>el('counted').focus(),50);
  };
  el('cancelClose').onclick=hideForms;
  el('check').onclick=()=>{
    const v=Number(el('counted').value);
    const r=el('closeResult');
    if(!Number.isFinite(v)||v<0){r.className='result bad';r.textContent='Introduce el efectivo contado.';return}
    const expected=Math.max(0,data.cash-data.expenses), diff=Number((v-expected).toFixed(2));
    data.counted=v;
    if(Math.abs(diff)<0.005){r.className='result ok';r.innerHTML='<strong>🟢 Cierre correcto</strong><div class="small" style="margin-top:4px">El efectivo contado coincide con el esperado.</div>'}
    else if(diff<0){r.className='result bad';r.innerHTML=`<strong>🔴 Faltan ${fmt(Math.abs(diff))}</strong><div class="small" style="margin-top:4px">El efectivo contado está por debajo del esperado.</div>`}
    else{r.className='result warn';r.innerHTML=`<strong>🟡 Sobran ${fmt(diff)}</strong><div class="small" style="margin-top:4px">El efectivo contado está por encima del esperado.</div>`}
    el('finishClose').classList.remove('hidden');
  };
  el('finishClose').onclick=()=>{data.closed=true;save();hideForms();render();alert('Cierre guardado.');};
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
})();
</script>
</body>
</html>
